services:
  wireshark:
    image: lscr.io/linuxserver/wireshark:4.6.6-r0-ls319
    container_name: wireshark
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      # Without these the LinuxServer image serves this desktop — which has a
      # terminal in it — with NO authentication at all. Verified.
      - CUSTOM_USER=${LAB_GUI_USER:-analyst}
      - PASSWORD=${LAB_GUI_PASSWORD:-labpass}
    volumes:
      - ../../data/caps:/caps:ro  # Shared packet captures
    ports:
      - "${LAB_BIND:-127.0.0.1}:3000:3000"
    cap_add:
      - NET_ADMIN
    security_opt:
      - seccomp:unconfined
    networks:
      security_net:
        ipv4_address: 172.20.0.2

  ubuntu-desktop:
    image: lscr.io/linuxserver/webtop@sha256:70b923d988f0f5a2e55a29706222ae5dcf6c9d9d78b2cc37d277d8612397d008  # multi-arch (amd64+arm64), maintained; native on Apple Silicon
    container_name: ubuntu-desktop
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      # Without these the LinuxServer image serves this desktop — which has a
      # terminal in it — with NO authentication at all. Verified.
      - CUSTOM_USER=${LAB_GUI_USER:-analyst}
      - PASSWORD=${LAB_GUI_PASSWORD:-labpass}
    ports:
      - "${LAB_BIND:-127.0.0.1}:6080:3000" # Browser desktop: open http://localhost:6080
    volumes:
      - ./config:/config
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined
    networks:
      security_net:
        ipv4_address: 172.20.0.3

  attacker:
    image: ghcr.io/michael-borck/ethical-base:latest
    container_name: week7-attacker
    stdin_open: true
    tty: true
    networks:
      - security_net
    cap_add:
      - NET_ADMIN
    security_opt:
      - seccomp:unconfined

  workstation:
    image: alpine:3.22
    container_name: workstation
    command: /bin/sh -c "while true; do sleep 3600; done"
    networks:
      security_net:
        ipv4_address: 172.20.0.5

  netshoot:
    image: nicolaka/netshoot:v0.13
    container_name: netshoot
    command: tail -f /dev/null # Keeps the container running
    networks:
      security_net:
        ipv4_address: 172.20.0.6
    cap_add:
      - NET_ADMIN # Allows advanced networking operations
    security_opt:
      - seccomp:unconfined # Allows for more system calls, useful for some networking tools

  ldap:
    image: osixia/openldap:1.5.0
    container_name: ldap
    environment:
      LDAP_ORGANISATION: "Example Organization"
      LDAP_DOMAIN: "example.org"
      LDAP_ADMIN_PASSWORD: "admin"
    ports:
      - "${LAB_BIND:-127.0.0.1}:10389:389" # host 10389 -> container 389 (avoids clashing with a local LDAP)
    networks:
      security_net:
        ipv4_address: 172.20.0.7

  mail:
    image: mailhog/mailhog:v1.0.1
    container_name: mail
    ports:
      - "${LAB_BIND:-127.0.0.1}:8025:8025"
      - "${LAB_BIND:-127.0.0.1}:1025:1025"
    networks:
      security_net:
        ipv4_address: 172.20.0.8

  mysql:
    image: mysql:8.0.43
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: "rootpassword"
      MYSQL_DATABASE: "exampledb"
      MYSQL_USER: "user"
      MYSQL_PASSWORD: "userpassword"
    ports:
      - "${LAB_BIND:-127.0.0.1}:13306:3306" # host 13306 -> container 3306 (avoids clashing with a local MySQL)
    networks:
      security_net:
        ipv4_address: 172.20.0.9

  telnet:
    image: alpine:3.22
    container_name: telnet
    command: sh -c "apk add --no-cache busybox-extras && /usr/sbin/telnetd -F"
    ports:
      - "${LAB_BIND:-127.0.0.1}:2323:23" # host 2323 -> container 23 (avoids clashing with a local telnet)
    networks:
      security_net:
        ipv4_address: 172.20.0.10

  juice-shop:
    image: bkimminich/juice-shop:v20.1.1
    container_name: juice-shop
    ports:
      - "${LAB_BIND:-127.0.0.1}:3012:3000"
    networks:
      security_net:
        ipv4_address: 172.20.0.11

  dvwa:
    image: ghcr.io/digininja/dvwa@sha256:c7e272f2b6b617bd4446ee5439f525f8ba562c46ac9b1787609b45b68591d0f8  # multi-arch (amd64+arm64); needs the dvwa-db service below
    container_name: dvwa
    environment:
      - DB_SERVER=dvwa-db
    depends_on:
      - dvwa-db
    ports:
      - "${LAB_BIND:-127.0.0.1}:8085:80" # browse http://localhost:8085 then /setup.php -> Create / Reset Database
    networks:
      security_net:
        ipv4_address: 172.20.0.12

  dvwa-db:
    image: mariadb:10.11.11
    container_name: dvwa-db
    environment:
      - MYSQL_ROOT_PASSWORD=dvwa
      - MYSQL_DATABASE=dvwa
      - MYSQL_USER=dvwa
      - MYSQL_PASSWORD=p@ssw0rd
    networks:
      security_net:
        ipv4_address: 172.20.0.13

networks:
  security_net:
    ipam:
      config:
        - subnet: 172.20.0.0/24
