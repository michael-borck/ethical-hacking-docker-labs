version: '3.9'
services:
  wireshark:
    image: lscr.io/linuxserver/wireshark:4.6.6-r0-ls319
    container_name: week3-wireshark
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      # Without these the LinuxServer image serves this desktop — which has a
      # terminal in it — with NO authentication at all. Verified.
      - CUSTOM_USER=${LAB_GUI_USER:-analyst}
      - PASSWORD=${LAB_GUI_PASSWORD:-labpass}
    volumes:
      - ../../data/caps:/caps:ro  # Shared packet captures
    ports:
      - "${LAB_BIND:-127.0.0.1}:3000:3000"
    cap_add:
      - NET_ADMIN
    security_opt:
      - seccomp:unconfined
    networks:
      traffic_net:
        ipv4_address: 172.30.0.2
    restart: unless-stopped

  sample-target:
    image: nicolaka/netshoot:v0.13
    container_name: week3-target
    command: tail -f /dev/null  # Dummy target for simulated traffic
    networks:
      traffic_net:
        ipv4_address: 172.30.0.3
    cap_add:
      - NET_ADMIN
    restart: unless-stopped

networks:
  traffic_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24